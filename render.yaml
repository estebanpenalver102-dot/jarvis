databases:
  - name: jarvis-db
    databaseName: jarvis
    user: jarvis
    plan: free

services:
  - type: web
    name: jarvis-api
    env: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: jarvis-ui
    env: node
    rootDir: ui
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://jarvis-api-fufo.onrender.com
      - key: PORT
        value: "3000"

  # ── OPTIONAL keep-warm cron (disabled by default) ──────────────────────────
  # Pings jarvis-api's /health/live every 10 minutes so the free-tier instance
  # never fully spins down. This runs entirely on Render's own infrastructure
  # (not SureThing), so it does not touch the SureThing credit budget — the
  # 2026-07-26 decision to stop SureThing-side keep-warm polling is unrelated.
  # Uncomment to enable. REMOVE this block entirely once/if jarvis-api is
  # upgraded to a paid instance type (paid instances don't spin down, so a
  # keep-warm ping would just be wasted cron minutes at that point).
  # - type: cron
  #   name: jarvis-api-keepwarm
  #   env: docker
  #   dockerfilePath: ./api/Dockerfile
  #   dockerContext: ./api
  #   plan: free
  #   schedule: "*/10 * * * *"
  #   dockerCommand: "curl -sf https://jarvis-api-fufo.onrender.com/health/live || true"
