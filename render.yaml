databases:
  - name: jarvis-db
    databaseName: jarvis
    user: jarvis
    plan: free

services:
  - type: redis
    name: jarvis-redis
    plan: free

  - type: web
    name: jarvis-api
    env: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: jarvis-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: jarvis-redis
          type: redis
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: jarvis-ui
    env: node
    rootDir: ui
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://jarvis-api-fufo.onrender.com
      - key: PORT
        value: "3000"
